name: Windows 11 Arm64 CI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: msbuild MySolution.sln /p:Configuration=Release

      - name: Run tests
        run: dotnet test --no-build --verbosity normal
